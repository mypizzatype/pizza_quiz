ENF:{p:"魔鬼辣肠执行力强，能把你的点子落地；你给TA松弛感。关键是约好谁负责收尾，别两个人都在起跑。",n:"玛丽娜拉重规则与细节，你的随性让TA焦虑。化解：重要的事提前讲好，细节交给TA把关。",l:"新鲜感是你的强项，也要经营平淡日子里的承诺。",w:"创意担当，找一个负责落地的搭档。",f:"气氛担当，朋友低落时要的是倾听，不是笑话。",s:"压力大时会逃避，转去追新鲜事，事情越堆越多。",r:"“未完成清单”只选1件完成；每晚10分钟整理。",a:["完成一件拖了很久的事","对一个承诺提前确认","晚上少刷一小时，留给自己安静"]},
